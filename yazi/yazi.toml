"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[manager]
linemode = "size"
show_hidden = true
sort_by = "natural"

[preview]
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [
	{ run = '${EDITOR:=nvim} "$@"', desc = "$EDITOR", block = true },
	{ run = 'code "$@"', orphan = true },
]

browser = [
	{ run = 'open "$@"', orphan = true, desc = "Open in browser" },
]

log_html = [
	{ run = '''
		for file in "$@"; do
			if [[ "$file" == *.html ]] && [[ "$file" == *log* ]]; then
				open "$file"
			else
				${EDITOR:=nvim} "$file"
			fi
		done
	''', desc = "Smart HTML opener", block = true },
]

[open]
rules = [
	{ name = "*log*.html", use = "browser" },
	{ name = "*.html", use = [ "browser", "edit" ] },
	{ mime = "text/html", use = "browser" },
]
