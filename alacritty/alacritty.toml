[general]
live_config_reload = true
import = ["~/.config/alacritty/keybinds.toml", "~/.config/alacritty/theme.toml"]

[window]
dimensions = { columns = 70, lines = 70 }
padding = { x = 40, y = 10 }

[font]
size = 18
offset.x=0
offset.y=0
glyph_offset.x=0
glyph_offset.y=0

[font.normal]
family = "Iosevka Nerd Font"
[cursor]
style = "Underline"
unfocused_hollow = false
thickness = 0.30

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

