command_alias_start_index: 200

keybindings:
  prefix_table: Space
  root_table: C-Space

title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=#fabd2f,align=centre,bold

position:
  x: C
  y: C

custom_variables: {}
macros: []

items:
  - name: +Panes
    key: p
    menu:
      - name: Up
        key: u
        command: select-pane -U
      - name: Down
        key: e
        command: select-pane -D
      - name: Left
        key: n
        command: select-pane -L
      - name: Right
        key: i
        command: select-pane -R
      - separator: true
      - name: Split horizontal
        key: /
        command: split-window -h -c "#{pane_current_path}"
      - name: Split vertical
        key: "-"
        command: split-window -v -c "#{pane_current_path}"
      - name: Zoom pane
        key: z
        command: resize-pane -Z
      - name: Synchronize panes
        key: m
        command: set-window-option synchronize-panes
      - name: Kill pane
        key: x
        command: kill-pane

  - name: +Windows
    key: w
    menu:
      - name: Next window
        key: n
        command: next-window
      - name: Previous window
        key: p
        command: previous-window
      - name: New window
        key: c
        command: new-window -c "#{pane_current_path}"
      - name: Rename window
        key: R
        command: command-prompt -p "Rename window:" "rename-window '%%'"
      - name: Choose window
        key: W
        command: choose-tree -Zw

  - name: +Sessions
    key: s
    menu:
      - name: fzf sessions
        key: s
        command: display-popup -E -w 80% -h 70% "sh ~/.tmux/scripts/tmux-session-picker"
      - name: New session
        key: c
        command: command-prompt -p "New session name:" "new-session -A -s '%%'"
      - name: Choose tree
        key: S
        command: choose-tree -Zw
      - name: Last session
        key: l
        command: switch-client -l

  - name: +Client
    key: c
    menu:
      - name: Reload config
        key: r
        command: source-file ~/.tmux.conf
      - name: Detach
        key: d
        command: detach-client
      - name: List clients
        key: l
        command: list-clients

  - name: +Layouts
    key: l
    menu:
      - name: Next layout
        key: l
        command: next-layout
      - name: Previous layout
        key: h
        command: previous-layout
      - name: Even horizontal
        key: e
        command: select-layout even-horizontal
      - name: Even vertical
        key: v
        command: select-layout even-vertical
      - name: Main horizontal
        key: m
        command: select-layout main-horizontal
      - name: Main vertical
        key: M
        command: select-layout main-vertical
      - name: Tiled
        key: t
        command: select-layout tiled

  - separator: true

  - name: Kill window
    key: X
    command: kill-window
  - name: Swap pane up
    key: N
    command: swap-pane -d -t -1
  - name: Swap pane down
    key: I
    command: swap-pane -d -t +1
