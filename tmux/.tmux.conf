# tmux configuration
# Prefix: Ctrl-b (tmux default)
# Reload this file with Prefix + r.

##### Terminal and input ######################################################

if-shell "uname | grep -q Darwin" \
  "set -g default-shell /opt/homebrew/bin/zsh" \
  "set -g default-shell /usr/bin/zsh"

set -g default-terminal "alacritty"
set -ga terminal-overrides ",alacritty:Tc"
set -s escape-time 1
set -s extended-keys on
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g bell-action none
set -g display-time 2000

# Keep tmux's vi editing and copy-mode controls.
set -g mode-keys vi
set -g status-keys vi
set -g repeat-time 1000
set -g set-clipboard on

##### Prefix and pane navigation ##############################################

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind X kill-window
bind q confirm-before -p "Kill session #S? (y/n)" kill-session
bind C-b send-prefix

# Vi-style pane navigation. These are repeatable with Prefix -r.
bind -r u select-pane -U
bind -r e select-pane -D
bind -r n select-pane -L
bind -r i select-pane -R
bind -r C-u resize-pane -U 5
bind -r C-e resize-pane -D 5
bind -r C-n resize-pane -L 5
bind -r C-i resize-pane -R 5

# Move the active pane around the layout.
bind -r N swap-pane -d -t -1
bind -r I swap-pane -d -t +1

# Useful pane commands.
bind z resize-pane -Z
bind m set-window-option synchronize-panes

##### Windows and sessions ####################################################

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g exit-empty off

bind -r [ previous-window
bind -r ] next-window
bind -r C-[ swap-window -d -t -1
bind -r C-] swap-window -d -t +1
bind c new-window -c "#{pane_current_path}"
bind R command-prompt -p "Rename window:" "rename-window '%%'"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind C command-prompt -p "New session name:" "new-session -A -s '%%'"

# Built-in tree picker: Prefix + S, then choose a session/window/pane.
bind S choose-tree -Zw

# fzf session picker in a native tmux popup.
bind s display-popup -E -w 80% -h 70% \
  "sh ~/.tmux/scripts/tmux-session-picker"

# fzf picker for every window across every session.
bind w display-popup -E -w 85% -h 80% \
  "sh ~/.tmux/scripts/tmux-window-picker"

##### Copy mode ################################################################

bind Escape copy-mode
bind -T copy-mode-vi u send -X cursor-up
bind -T copy-mode-vi U send -N 5 -X cursor-up
bind -T copy-mode-vi e send -X cursor-down
bind -T copy-mode-vi E send -N 5 -X cursor-down
bind -T copy-mode-vi n send -X cursor-left
bind -T copy-mode-vi N send -X start-of-line
bind -T copy-mode-vi i send -X cursor-right
bind -T copy-mode-vi I send -X end-of-line
bind -T copy-mode-vi v send -X begin-selection

##### Gruvbox theme ###########################################################

# Transparent/default backgrounds let the terminal background show through.
set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left ""
set -g status-right "#[fg=#928374]#S"

# Window labels are centered: [index] name. The active window is bold.
set -g window-status-format "#[fg=#665c54][#I]#[fg=#928374] #W"
set -g window-status-current-format "#[fg=#fabd2f][#I]#[fg=#ebdbb2] #W"
set -g window-status-style "fg=#928374,bg=default,nobold"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=green},bg=default,bold"
set -g window-status-activity-style "fg=#fb4934,bg=default,nobold"
set -g window-status-bell-style "fg=#fb4934,bg=default,nobold"

# Pane borders remain subtle, with a brighter active border.
set -g pane-border-lines simple
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#d79921"

##### Plugins ##################################################################

# TPM: install with Prefix + I after adding a plugin.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @continuum-restore 'on'

if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
